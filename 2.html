<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #294839;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            width: 100%;
            width: 100vw;
            min-height: 100vh;
            background-color: #2c5e5e;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 48px;
            font-weight: 700;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 300px;
            padding: 18px 25px;        
            border-radius: 12px;
            background: white;
            font-size: 18px;
        }

   
        .stylebutton {
            padding: 18px 35px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            background: #7f8c8d;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            min-width: 150px;
        }        
        .stylebutton:hover {
            background-color: #38393a;
        }        
        .list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 25px;
            padding-right: 15px;
            max-height: calc(100vh - 300px);
        }

        .item {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            background-color: rgb(255, 236, 236);
            border-radius: 16px;
            margin-bottom: 15px;    
        
        }
        .item:hover{
            background-color: #7f8c8d;
        }
        .item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 20px;
            cursor: pointer;
        }       
        .item label {
            flex: 1;
            color: #333;
            font-size: 20px;
            font-weight: 500;
        }   
        .item button {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 26px;
            cursor: pointer;
            padding: 8px 16px;
            transition: transform 0.2s, color 0.2s;
            border-radius: 8px;
        }
        .item button:hover {
            color: #c0392b;
            transform: scale(1.1);
            background-color: rgba(231, 76, 60, 0.1);
        }      
    </style>
</head>
<body>
    <div class="container">
        <h1>Список дел</h1>
        
        <div class="input-row">
            <input type="text" value="Новый элемент списка">
            <button class="stylebutton">Создать</button>
            <button class="stylebutton">Очистить все</button>
        </div>

        <div class="list">
            <div class="item">
                <input type="checkbox">
                <label>Почесать кошку</label>
                <sub>24.08.2023</sub>
                <button>❌</button>
            </div>
            <div class="item">
                <input type="checkbox">
                <label>Полить картошку</label>
                <sub>24.08.2023</sub>
                <button>❌</button>
            </div>
      
            <div class="item">
                <input type="checkbox">
                <label>Сложить в лукошко</label>
                <sub>24.08.2023</sub>
                <button>❌</button>
            </div>
    
        </div>

        <div style="color:#ecf0f1">
        <label>Copyright </label>&copy; 
        </div>
    </div>
</body>
</html>
